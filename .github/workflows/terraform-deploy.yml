name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino"
        required: true
        type: choice
        options:
          - homolog

permissions:
  contents: read

concurrency:
  group: terraform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Terraform Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/homolog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Deployment Information
        run: |
          echo "Ambiente: ${{ inputs.environment }}"
          echo "Terraform validado."
          echo "Provisionamento AWS ainda nao habilitado."