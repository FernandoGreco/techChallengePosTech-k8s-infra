name: Terraform Validate

on:
  pull_request:
    branches:
      - main
      - homolog
      - production
  push:
    branches:
      - feature/terraform-k8s-infra
      - homolog
      - production

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform and Shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: environments/homolog
        run: terraform init -backend=false -input=false
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-ci

      - name: Terraform Validate
        working-directory: environments/homolog
        run: terraform validate
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-ci

      - name: Validate Shell Scripts
        run: |
          set -euo pipefail
          find scripts modules/ec2/user-data \
            -type f -name "*.sh" -print0 |
            xargs -0 -r -n 1 bash -n