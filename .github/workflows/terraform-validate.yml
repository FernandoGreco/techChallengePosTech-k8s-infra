name: Terraform Validate

on:
  pull_request:
    branches: [main, homolog]
  push:
    # homolog/main invoke this reusable CI through Terraform Deploy.
    branches: ['feature/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolate Terraform data
        run: echo "TF_DATA_DIR=$RUNNER_TEMP/terraform-ci" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned validators
        run: bash scripts/install-ci-tools.sh
      - name: Terraform formatting and validation without backend
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          for target in homolog production; do
            TF_DATA_DIR="$RUNNER_TEMP/terraform-ci-$target" terraform -chdir="environments/$target" init -backend=false -input=false -lockfile=readonly
            TF_DATA_DIR="$RUNNER_TEMP/terraform-ci-$target" terraform -chdir="environments/$target" validate -no-color
          done
      - name: Validate every Bash file separately
        run: |
          set -euo pipefail
          find scripts modules/ec2/user-data tests observability -type f -name '*.sh' -print0 |
            xargs -0 -r -n 1 bash -n
      - name: Parse PowerShell without executing scripts or loading credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem observability -Filter '*.ps1' -File) {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "PowerShell syntax failed: $($file.Name)" }
          }
      - name: Test plan encryption and approval guards without AWS
        run: |
          node --test tests/cicd-guards.test.mjs tests/kubernetes-bootstrap.test.mjs
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/kubelet-serving-tls.py').read_text())"
          python3 tests/kubelet_serving_tls_test.py
      - name: Validate GitHub Actions
        run: actionlint -shellcheck=
      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -kubernetes-version 1.34.0 tests/hpa-lab.yaml tests/production-hpa/load-job.yaml observability/grafana-rbac.yaml observability/smoke-test.yaml
      - name: Validate monitoring values and rendered manifests without credentials
        run: |
          set -euo pipefail
          helm pull k8s-monitoring --repo https://grafana.github.io/helm-charts --version 4.5.5 --untar --untardir "$RUNNER_TEMP"
          helm lint "$RUNNER_TEMP/k8s-monitoring" -f observability/grafana-lightweight.values.yaml
          helm template grafana-cloud "$RUNNER_TEMP/k8s-monitoring" --namespace grafana-monitoring --kube-version 1.34.12 --include-crds -f observability/grafana-lightweight.values.yaml > "$RUNNER_TEMP/monitoring.yaml"
          if grep -q '^kind: Secret$' "$RUNNER_TEMP/monitoring.yaml"; then
            echo 'Monitoring must reference an existing Secret, not render credentials.' >&2
            exit 1
          fi
          # Alloy/its CRD have no schema in kubeconform's Kubernetes catalog.
          # Helm validates chart values; skip only these known custom kinds.
          kubeconform -strict -summary -kubernetes-version 1.34.0 -skip Alloy,CustomResourceDefinition "$RUNNER_TEMP/monitoring.yaml"
      - name: Record validation scope
        run: |
          echo 'CI passed without AWS credentials, backend access or Kubernetes mutations.' >> "$GITHUB_STEP_SUMMARY"
