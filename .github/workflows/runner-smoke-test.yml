name: Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: [self-hosted, Windows, k8s-infra]
    steps:
      - name: Verify Git Bash and tools
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          bash --version | head -n 1
          aws --version
          terraform version
          ssh -V
          echo "Runner Windows OK"
