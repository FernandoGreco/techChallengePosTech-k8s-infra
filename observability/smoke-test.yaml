# Teste isolado e temporário: produz log JSON e eventos de ciclo de vida.
apiVersion: v1
kind: Pod
metadata:
  name: tc3-observability-check
  namespace: grafana-monitoring
  labels:
    app: tc3-observability-check
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: busybox:1.36
      command: [/bin/sh, -c]
      args:
        - 'echo "{\"event\":\"tc3-observability-check\",\"source\":\"infra-validation\"}"; sleep 120'
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
