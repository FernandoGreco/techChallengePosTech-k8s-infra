apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-cloud-alloy-daemon
  namespace: grafana-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tc3-grafana-collector-read
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, namespaces, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics, nodes/proxy]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tc3-grafana-collector-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tc3-grafana-collector-read
subjects:
  - kind: ServiceAccount
    name: grafana-cloud-alloy-daemon
    namespace: grafana-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tc3-grafana-credentials-read
  namespace: grafana-monitoring
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [grafana-cloud-credentials]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tc3-grafana-credentials-read
  namespace: grafana-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tc3-grafana-credentials-read
subjects:
  - kind: ServiceAccount
    name: grafana-cloud-alloy-daemon
    namespace: grafana-monitoring
